[package]
name = "winlldp"
version = "1.2.0"
edition = "2021"
license = "MIT"
authors = ["Dominik Tröster, Verbandsgemeinde Otterbach-Otterberg"]
description = "LLDP network discovery and advertisement desktop application"
build = "build.rs"
default-run = "winlldp"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
libloading = "0.8"
ctrlc = "3.5"
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "accesskit"] }
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
rfd = "0.15"

[target.'cfg(windows)'.dependencies]
# Uses the Packet Monitor support already present in Windows; no Npcap needed for RX.
winptap = { version = "=0.2.0" }
ipconfig = "0.3"
tray-icon = "0.21"
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_System_Console"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
