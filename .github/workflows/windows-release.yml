name: Windows x64 build and release

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  windows-x64:
    name: Test, build and package on Windows
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install stable Rust MSVC toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies and build
        uses: Swatinem/rust-cache@v2

      - name: Run Rust tests on Windows
        shell: pwsh
        run: cargo test --locked --target x86_64-pc-windows-msvc

      - name: Build native Windows executables
        shell: pwsh
        run: cargo build --locked --release --target x86_64-pc-windows-msvc --bins

      - name: Ensure Inno Setup 6 is available
        shell: pwsh
        run: |
          $possiblePaths = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $found = $possiblePaths | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $found -and -not (Get-Command ISCC.exe -ErrorAction SilentlyContinue)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Unable to install Inno Setup 6" }
          }

      - name: Package and smoke-test Windows EXEs and installer
        shell: pwsh
        run: ./scripts/package_windows.ps1

      # UI QA uses synthetic adapters and a bundled LLDP fixture; no capture
      # driver or physical switch is needed. Screenshots stay in CI artifacts.
      - name: Render UI QA previews (best effort)
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Stop'
          $gui = (Resolve-Path 'target/x86_64-pc-windows-msvc/release/winlldp.exe').Path
          New-Item -Path 'build/previews' -ItemType Directory -Force | Out-Null
          $cases = @(
            @{ name = 'neighbors-dark'; args = @('--page','0','--dark','--open','tests/fixtures/lab.pcap') },
            @{ name = 'adapters-light'; args = @('--page','1','--light','--qa-adapter') },
            @{ name = 'sender-dark'; args = @('--page','2','--dark','--qa-adapter') },
            @{ name = 'settings-light'; args = @('--page','4','--light','--qa-adapter') }
          )
          foreach ($case in $cases) {
            $path = (Join-Path (Get-Location).Path "build/previews/$($case.name).png")
            $arguments = @('--screenshot', $path, '--compact') + $case.args
            $process = Start-Process -FilePath $gui -ArgumentList $arguments -PassThru
            if (-not $process.WaitForExit(20000)) {
              $process.Kill()
              throw "UI preview timed out: $($case.name)"
            }
            if ($process.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $path)) {
              throw "UI preview missing/failed: $($case.name) exit=$($process.ExitCode)"
            }
            Write-Host "UI preview: $path"
          }

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WinLLDP-1.2.0-Windows-x64
          path: build/
          if-no-files-found: error

      - name: Commit binaries and create release v1.2.0
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'v1.2.0'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; not overwriting it."
            exit 0
          }

          git fetch --tags
          if ((git tag -l $tag) -eq $tag) {
            throw "Tag $tag already exists without a release; refusing to move an immutable release tag."
          }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f build/
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            throw 'Windows build artifacts were not staged. Release will not be created.'
          }
          git commit -m 'build: add verified Windows v1.2.0 binaries and installer [skip ci]'
          if ($LASTEXITCODE -ne 0) { throw 'Commit of build artifacts failed' }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw 'Push of build artifacts failed' }

          git tag -a $tag -m 'WinLLDP v1.2.0 Windows x64'
          if ($LASTEXITCODE -ne 0) { throw 'Creating release tag failed' }
          git push origin $tag
          if ($LASTEXITCODE -ne 0) { throw 'Pushing release tag failed' }

          $assets = @(
            'build/WinLLDP-1.2.0-Windows-x64.exe',
            'build/winlldp-cli-1.2.0-Windows-x64.exe',
            'build/WinLLDP-1.2.0-Windows-x64-Setup.exe',
            'build/SHA256SUMS.txt',
            'build/BUILD_INFO.txt',
            'build/LICENSE.txt',
            'build/THIRD_PARTY_NOTICES.md',
            'build/Cargo.lock'
          )
          & gh release create $tag @assets --repo $env:GITHUB_REPOSITORY --title 'WinLLDP v1.2.0' --notes-file docs/RELEASE_NOTES_v1.2.0.md --verify-tag
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release creation failed' }
