name: Windows x64 build and release

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  linux-x64:
    name: Build Linux x64 Slint GUI and CLI
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux UI build libraries
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libudev-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build and check Linux binaries
        run: sh scripts/build-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: WinLLDP-1.2.1-Linux-x64
          path: build/linux-x64/
          if-no-files-found: error

  windows-x64:
    needs: linux-x64
    name: Test, build and package on Windows
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install stable Rust MSVC toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies and build
        uses: Swatinem/rust-cache@v2

      - name: Synchronize package version in Cargo.lock
        shell: pwsh
        run: python scripts/sync_lock_version.py

      - name: Run Rust tests on Windows
        shell: pwsh
        run: cargo test --locked --target x86_64-pc-windows-msvc

      - name: Build native Windows executables
        shell: pwsh
        run: cargo build --locked --release --target x86_64-pc-windows-msvc --bins

      - name: Ensure Inno Setup 6 is available
        shell: pwsh
        run: |
          $possiblePaths = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $found = $possiblePaths | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $found -and -not (Get-Command ISCC.exe -ErrorAction SilentlyContinue)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Unable to install Inno Setup 6" }
          }

      - name: Download Linux binaries and regenerated license bundle
        uses: actions/download-artifact@v4
        with:
          name: WinLLDP-1.2.1-Linux-x64
          path: release-input/linux

      - name: Import complete third-party licenses before Windows packaging
        shell: pwsh
        run: |
          $licensePath = 'release-input/linux/THIRD_PARTY_LICENSES.txt'
          if (-not (Test-Path -LiteralPath $licensePath)) {
            throw 'Linux-generated third-party license file is missing.'
          }
          $licenseBytes = (Get-Item -LiteralPath $licensePath).Length
          if ($licenseBytes -lt 1000000) {
            throw "Third-party license bundle is unexpectedly short: $licenseBytes bytes."
          }
          Copy-Item -LiteralPath $licensePath -Destination 'THIRD_PARTY_LICENSES.txt' -Force
          Write-Host "Using $licenseBytes bytes of regenerated dependency licenses for the Windows installer."

      - name: Package and smoke-test Windows EXEs and installer
        shell: pwsh
        run: ./scripts/package_windows.ps1

      - name: Flatten Linux binaries into build directory
        shell: pwsh
        run: |
          Move-Item release-input/linux/WinLLDP-Linux-x64 build/WinLLDP-Linux-x64
          Move-Item release-input/linux/WinLLDP-CLI-Linux-x64 build/WinLLDP-CLI-Linux-x64
          Move-Item release-input/linux/BUILD_INFO-Linux.txt build/BUILD_INFO-Linux.txt
          Move-Item release-input/linux/SHA256SUMS-Linux.txt build/SHA256SUMS-Linux.txt
          $packagedLicense = (Get-Item -LiteralPath build/THIRD_PARTY_LICENSES.txt).Length
          if ($packagedLicense -lt 1000000) {
            throw "Packaged third-party licenses are unexpectedly short: $packagedLicense bytes."
          }
          $originalHash = (Get-FileHash -LiteralPath THIRD_PARTY_LICENSES.txt -Algorithm SHA256).Hash
          $packagedHash = (Get-FileHash -LiteralPath build/THIRD_PARTY_LICENSES.txt -Algorithm SHA256).Hash
          if ($originalHash -ne $packagedHash) {
            throw 'Packaged third-party licenses differ from the regenerated source file.'
          }
          Remove-Item release-input -Recurse -Force
          $releaseFiles = Get-ChildItem build -File | Where-Object { $_.Name -match "^WinLLDP-1\.2\.1-Windows-x64.*\.exe$|^winlldp-cli-1\.2\.1-Windows-x64\.exe$|^WinLLDP(-CLI)?-Linux-x64$" } | Sort-Object Name
          $hashLines = foreach ($file in $releaseFiles) { $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant(); "$hash  $($file.Name)" }
          $hashLines | Set-Content build/SHA256SUMS.txt -Encoding utf8

      - name: Upload Windows and Linux build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WinLLDP-1.2.1-Windows-x64
          path: build/
          if-no-files-found: error

      - name: Commit binaries and create release v1.2.1
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'v1.2.1'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; not overwriting it."
            exit 0
          }

          git fetch --tags
          if ((git tag -l $tag) -eq $tag) {
            throw "Tag $tag already exists without a release; refusing to move an immutable release tag."
          }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f build/ THIRD_PARTY_LICENSES.txt Cargo.lock
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            throw 'Windows build artifacts were not staged. Release will not be created.'
          }
          git commit -m 'build: add verified Windows v1.2.1 binaries and installer [skip ci]'
          if ($LASTEXITCODE -ne 0) { throw 'Commit of build artifacts failed' }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw 'Push of build artifacts failed' }

          git tag -a $tag -m 'WinLLDP v1.2.1 Windows x64'
          if ($LASTEXITCODE -ne 0) { throw 'Creating release tag failed' }
          git push origin $tag
          if ($LASTEXITCODE -ne 0) { throw 'Pushing release tag failed' }

          $assets = @(
            'build/WinLLDP-1.2.1-Windows-x64.exe',
            'build/winlldp-cli-1.2.1-Windows-x64.exe',
            'build/WinLLDP-1.2.1-Windows-x64-Setup.exe',
            'build/WinLLDP-Linux-x64',
            'build/WinLLDP-CLI-Linux-x64',
            'build/SHA256SUMS.txt',
            'build/BUILD_INFO.txt',
            'build/BUILD_INFO-Linux.txt',
            'build/SHA256SUMS-Linux.txt',
            'build/LICENSE.txt',
            'build/LICENSE-GPL-3.0-only.txt',
            'build/THIRD_PARTY_LICENSES.txt',
            'build/THIRD_PARTY_NOTICES.md',
            'build/Cargo.lock'
          )
          & gh release create $tag @assets --repo $env:GITHUB_REPOSITORY --title 'WinLLDP v1.2.1' --notes-file docs/RELEASE_NOTES_v1.2.1.md --verify-tag
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release creation failed' }
